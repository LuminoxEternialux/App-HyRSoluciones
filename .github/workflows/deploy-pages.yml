name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Rama o tag a desplegar (ej: work, main)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref != '' && github.event.inputs.deploy_ref || github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp *.html styles.css script.js _site/
          [ -f 404.html ] || cp index.html _site/404.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
